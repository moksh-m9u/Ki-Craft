[project]
name = "multimodal-rag"
version = "0.1.0"
description = "Multimodal RAG pipeline — PDF ingestion, vector search, and answer generation"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3",
    "langsmith>=0.9",
    "langchain-chroma>=0.2",
    "langchain-community>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-ibm>=1.1",
    "langchain-openai>=0.3",
    "unstructured[all-docs]>=0.15",
    "python-dotenv>=1.0",
    "streamlit>=1.28",
    "pandas>=2.0",
    "pillow>=10.0",
    "plotly>=5.18",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "opencv-python-headless==5.0.0.93",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3",
]

# Installed by `uv sync` along with the dependencies above.
[dependency-groups]
dev = [
    "pytest>=8.0",
    # FastAPI's TestClient (tests/api/) is built on httpx.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local summary model for ingestion (python -m mlx_vlm.server). MLX runs only
# on Apple silicon, so the marker keeps installs elsewhere working.
local = ["mlx-vlm>=0.7.12; sys_platform == 'darwin' and platform_machine == 'arm64'"]

# The repository is run from its root (python -m, uvicorn, streamlit), never
# installed as a package, so uv installs only the dependencies.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "live: calls the real store, watsonx, and Gemini; skipped unless run with -m live",
]
# langsmith 0.14's own langsmith/wrappers/__init__.py imports its deprecated
# _openai_agents module, which warns on every import of wrap_openai
# (src/ingestion/enrich.py). Our import path is the documented one; only
# this one message is silenced, so any other deprecation still shows.
filterwarnings = [
    "ignore:langsmith.wrappers._openai_agents is deprecated:DeprecationWarning",
]
