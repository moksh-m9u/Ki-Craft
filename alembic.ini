# Alembic configuration: where the migrations live. The database URL is not
# here; migrations/env.py reads DATABASE_URL_DIRECT through config/settings.py,
# so no connection string is ever written to a tracked file.
#
# Run from the repository root:
#   alembic upgrade head      create or update the tables
#   alembic downgrade -1      undo the latest migration
#   alembic current           show which migration the database is at

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
